blocks:
  - type: context
    label: CONTEXT
    editorial: PERSONAL_OBSERVATION
    content: "This observation was captured while building Daily Sahayak — an adaptive planning system for B.Tech students. Before writing a single line of code, I spent two weeks observing how I and three classmates actually used timetables versus how we thought we used them. The gap was significant enough to throw out the original feature set entirely and restart from the observed failure modes."

  - type: observation
    label: WHAT I NOTICED
    editorial: PERSONAL_OBSERVATION
    content: "Traditional scheduling software treats time as a knapsack problem: pack the highest-priority tasks into fixed calendar slots. But humans do not operate like linear constraint solvers. An unexpected 20-minute interruption destroys the entire downstream sequence, triggering a predictable psychological pattern — brief frustration, decision fatigue about what to defer, then total abandonment of the schedule. The schedule becomes a monument to failure rather than a working tool. Nobody abandoned their to-do list because it was incomplete. They abandoned it because recovery felt harder than starting over."

  - type: quote
    label: FIELD OBSERVATION
    editorial: SOURCE_DERIVED
    attribution: "Don Norman, The Design of Everyday Things (2013)"
    content: "\"When people make errors, it is often because the system failed to provide sufficient feedback or didn't match the user's mental model of how it should work. The system should adapt to the user, not the other way around.\""

  - type: analysis
    label: ANALYSIS
    editorial: INTERPRETATION
    content: "A resilient planning harness must treat the schedule as a state machine with explicit failure transitions — not error states, but designed recovery states. If a 45-minute task overflows, the system must not surface guilt or flag an error. It must dynamically recalculate remaining slack, identify deferrable milestones, and present a revised agenda that the user can accept with a single gesture. The key insight is that friction in the re-acceptance moment is where schedules die. People abandon planning tools not because they failed once — but because recovery requires more cognitive effort than starting fresh."

  - type: learning
    label: WHAT I LEARNED
    editorial: EXPERIMENTAL_RESULT
    content: "In Daily Sahayak, priority scoring weighted three axes: urgency, cognitive energy load, and hard deadlines. The most important discovery was separating schedule generation from calendar commitment. Showing a proposed adjustment and requesting a single tap to accept — rather than requiring the user to manually re-arrange calendar blocks — reduced schedule abandonment by an estimated 40% in informal testing with 5 peers over three weeks. This was not a controlled study. But the directional signal was clear enough to build from."

  - type: impact
    label: IMPACT ON MY THINKING
    editorial: PROJECT_EVIDENCE
    content: "This observation permanently changed how I evaluate adaptive systems. Mathematical optimality is not the goal — friction minimization at the recovery moment is. A 90% optimal plan that the user actually follows is infinitely more valuable than a 100% optimal plan they abandon at the first interruption. This principle now applies to every system I design that must survive contact with unpredictable human behavior: the failure mode to design for is not the first failure, but the second decision the user makes after that first failure."

